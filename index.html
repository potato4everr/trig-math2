<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trigonometrie-Rechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blueprint: #0E2A40;
    --blueprint-line: #1F4A66;
    --blueprint-line-soft: #163a53;
    --paper: #F3EFE2;
    --ink: #12202B;
    --amber: #E3A23B;
    --coral: #D9694F;
    --muted: #9FB6C4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--blueprint);
    color: var(--paper);
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 22px 70px;
  }

  header {
    margin-bottom: 30px;
  }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    color: var(--paper);
    max-width: 16ch;
  }

  h1 em {
    color: var(--amber);
    font-style: italic;
  }

  .panel {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 26px 24px;
    margin-bottom: 22px;
  }

  .row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.82rem;
    color: #5a6570;
  }

  input[type="number"] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.1rem;
    padding: 8px 10px;
    border: 1px solid #c9c2ad;
    border-radius: 3px;
    background: #fff;
    width: 140px;
    color: var(--ink);
  }

  .toggle-group {
    display: flex;
    border: 1px solid #c9c2ad;
    border-radius: 3px;
    overflow: hidden;
  }

  .toggle-group button {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.9rem;
    padding: 9px 16px;
    border: none;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .toggle-group button.active {
    background: var(--ink);
    color: var(--paper);
  }

  .results {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 18px;
    margin-top: 24px;
  }

  .result dt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: #7a8590;
    margin-bottom: 3px;
  }

  .result dd {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.15rem;
    color: var(--ink);
  }

  .result dd.undef {
    color: var(--coral);
    font-size: 0.95rem;
  }

  .graph-panel {
    background: var(--blueprint);
    border: 1px solid var(--blueprint-line);
    border-radius: 4px;
    padding: 20px;
  }

  .graph-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .func-toggles {
    display: flex;
    gap: 8px;
  }

  .func-toggles button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    padding: 7px 14px;
    border-radius: 3px;
    border: 1px solid var(--blueprint-line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }

  .func-toggles button.on[data-fn="sin"] { background: #E3A23B; color: var(--ink); border-color: #E3A23B; }
  .func-toggles button.on[data-fn="cos"] { background: #6FB2A8; color: var(--ink); border-color: #6FB2A8; }
  .func-toggles button.on[data-fn="tan"] { background: #D9694F; color: var(--ink); border-color: #D9694F; }

  canvas {
    width: 100%;
    height: 340px;
    display: block;
    border-radius: 3px;
  }

  .sliders {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  .slider-field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .slider-field span {
    color: var(--amber);
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--amber);
  }

  .formula {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .formula b { color: var(--paper); }

  @media (max-width: 640px) {
    .results { grid-template-columns: repeat(2, 1fr); }
    .sliders { grid-template-columns: 1fr; }
  }

  .tri-panel { margin-top: 22px; }

  .tri-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.4rem;
    color: var(--paper);
    margin-bottom: 6px;
  }

  .tri-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .tri-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 16px;
    background: var(--paper);
    border-radius: 4px;
    padding: 22px;
  }

  .tri-field label {
    font-size: 0.8rem;
    color: #5a6570;
    display: block;
    margin-bottom: 5px;
  }

  .tri-field input {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    padding: 8px 9px;
    border: 1px solid #c9c2ad;
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }

  .tri-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
  }

  .tri-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.95rem;
    padding: 10px 20px;
    border-radius: 3px;
    border: none;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }

  .tri-btn:hover { background: #22323f; }

  .tri-clear {
    background: transparent;
    border: 1px solid #c9c2ad;
    color: #5a6570;
    padding: 9px 16px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .tri-error {
    grid-column: 1 / -1;
    color: var(--coral);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    min-height: 1em;
  }

  .tri-output {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .tri-canvas-wrap {
    background: var(--blueprint);
    border: 1px solid var(--blueprint-line);
    border-radius: 4px;
    padding: 14px;
  }

  .tri-canvas-wrap canvas {
    width: 100%;
    height: 260px;
    display: block;
  }

  .tri-values dl {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
    align-content: start;
  }

  .tri-values dt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .tri-values dd {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.05rem;
    color: var(--paper);
  }

  .solution-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .solution-tabs button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 3px;
    border: 1px solid var(--blueprint-line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }

  .solution-tabs button.active {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }

  @media (max-width: 640px) {
    .tri-grid { grid-template-columns: repeat(2, 1fr); }
    .tri-output { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="kicker">Winkelfunktionen · live berechnet & gezeichnet</div>
    <h1>Trigonometrie-<em>Rechner</em></h1>
  </header>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label for="angle">Winkel</label>
        <input type="number" id="angle" value="45" step="1">
      </div>
      <div class="toggle-group" id="unitToggle">
        <button class="active" data-unit="deg">Grad</button>
        <button data-unit="rad">Radiant</button>
      </div>
    </div>

    <dl class="results" id="results"></dl>
  </div>

  <div class="graph-panel">
    <div class="graph-panel-header">
      <div class="func-toggles" id="fnToggles">
        <button class="on" data-fn="sin">sin</button>
        <button class="on" data-fn="cos">cos</button>
        <button data-fn="tan">tan</button>
      </div>
    </div>
    <canvas id="graph"></canvas>

    <div class="sliders">
      <div class="slider-field">
        <label>Amplitude A <span id="ampVal">1.0</span></label>
        <input type="range" id="amp" min="0.2" max="2.5" step="0.1" value="1">
      </div>
      <div class="slider-field">
        <label>Frequenz B <span id="freqVal">1.0</span></label>
        <input type="range" id="freq" min="0.5" max="4" step="0.1" value="1">
      </div>
      <div class="slider-field">
        <label>Phase C <span id="phaseVal">0.0</span></label>
        <input type="range" id="phase" min="-3.14" max="3.14" step="0.1" value="0">
      </div>
    </div>

    <div class="formula">y = A · <b>fn</b>(B · x + C)</div>
  </div>

  <div class="tri-panel">
    <div class="tri-title">Dreiecksrechner</div>
    <div class="tri-sub">3 bekannte Werte eintragen (mind. eine Seite) — der Rest wird per Sinus- und Kosinussatz berechnet</div>
    <div class="tri-grid" id="triGrid">
      <div class="tri-field"><label>Seite a (gegenüber A)</label><input type="number" id="side_a" step="any" placeholder="—"></div>
      <div class="tri-field"><label>Seite b (gegenüber B)</label><input type="number" id="side_b" step="any" placeholder="—"></div>
      <div class="tri-field"><label>Seite c (gegenüber C)</label><input type="number" id="side_c" step="any" placeholder="—"></div>
      <div class="tri-field"><label>Winkel A (°)</label><input type="number" id="angle_A" step="any" placeholder="—"></div>
      <div class="tri-field"><label>Winkel B (°)</label><input type="number" id="angle_B" step="any" placeholder="—"></div>
      <div class="tri-field"><label>Winkel C (°)</label><input type="number" id="angle_C" step="any" placeholder="—"></div>
      <div class="tri-actions">
        <button class="tri-btn" id="triSolve">Berechnen</button>
        <button class="tri-clear" id="triClear">Zurücksetzen</button>
      </div>
      <div class="tri-error" id="triError"></div>
    </div>

    <div class="tri-output" id="triOutput" style="display:none;">
      <div class="tri-canvas-wrap">
        <div class="solution-tabs" id="triTabs"></div>
        <canvas id="triCanvas"></canvas>
      </div>
      <div class="tri-values">
        <dl id="triValues"></dl>
      </div>
    </div>
  </div>
</div>

<script>
  const angleInput = document.getElementById('angle');
  const unitToggle = document.getElementById('unitToggle');
  const resultsEl = document.getElementById('results');
  const fnToggles = document.getElementById('fnToggles');
  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');
  const ampSlider = document.getElementById('amp');
  const freqSlider = document.getElementById('freq');
  const phaseSlider = document.getElementById('phase');
  const ampVal = document.getElementById('ampVal');
  const freqVal = document.getElementById('freqVal');
  const phaseVal = document.getElementById('phaseVal');

  let unit = 'deg';
  let activeFns = { sin: true, cos: true, tan: false };
  const fnColors = { sin: '#E3A23B', cos: '#6FB2A8', tan: '#D9694F' };

  unitToggle.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    unit = e.target.dataset.unit;
    [...unitToggle.children].forEach(b => b.classList.toggle('active', b === e.target));
    update();
  });

  fnToggles.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    const fn = e.target.dataset.fn;
    activeFns[fn] = !activeFns[fn];
    e.target.classList.toggle('on', activeFns[fn]);
    drawGraph();
  });

  [ampSlider, freqSlider, phaseSlider].forEach(s => s.addEventListener('input', () => {
    ampVal.textContent = parseFloat(ampSlider.value).toFixed(1);
    freqVal.textContent = parseFloat(freqSlider.value).toFixed(1);
    phaseVal.textContent = parseFloat(phaseSlider.value).toFixed(1);
    drawGraph();
  }));

  angleInput.addEventListener('input', update);

  function toRad(v) { return unit === 'deg' ? v * Math.PI / 180 : v; }

  function fmt(v) {
    if (!isFinite(v)) return { text: 'undefiniert', undef: true };
    if (Math.abs(v) > 1e10) return { text: 'undefiniert', undef: true };
    return { text: v.toFixed(4), undef: false };
  }

  function update() {
    const v = parseFloat(angleInput.value) || 0;
    const rad = toRad(v);
    const vals = {
      sin: Math.sin(rad),
      cos: Math.cos(rad),
      tan: Math.tan(rad),
      cot: 1 / Math.tan(rad),
      sec: 1 / Math.cos(rad),
      csc: 1 / Math.sin(rad),
    };
    resultsEl.innerHTML = '';
    Object.entries(vals).forEach(([name, val]) => {
      const { text, undef } = fmt(val);
      const dt = document.createElement('dt');
      dt.textContent = name;
      const dd = document.createElement('dd');
      dd.textContent = text;
      if (undef) dd.classList.add('undef');
      resultsEl.appendChild(dt);
      resultsEl.appendChild(dd);
    });
    drawGraph(rad);
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  function drawGraph(currentRad) {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    const A = parseFloat(ampSlider.value);
    const B = parseFloat(freqSlider.value);
    const C = parseFloat(phaseSlider.value);

    const xMin = -2 * Math.PI, xMax = 2 * Math.PI;
    const yMax = 2.6;
    const originX = w / 2;
    const originY = h / 2;
    const scaleX = w / (xMax - xMin);
    const scaleY = h / (2 * yMax);

    // grid (graph paper feel)
    ctx.strokeStyle = 'rgba(159,182,196,0.15)';
    ctx.lineWidth = 1;
    const gridStepX = (Math.PI / 2) * scaleX;
    for (let gx = originX % gridStepX; gx < w; gx += gridStepX) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
    }
    const gridStepY = 0.5 * scaleY;
    for (let gy = originY % gridStepY; gy < h; gy += gridStepY) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
    }

    // axes
    ctx.strokeStyle = 'rgba(243,239,226,0.45)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(w, originY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, h); ctx.stroke();

    // pi labels
    ctx.fillStyle = 'rgba(159,182,196,0.7)';
    ctx.font = '11px "IBM Plex Mono", monospace';
    [-2, -1, 1, 2].forEach(k => {
      const x = originX + k * Math.PI * scaleX;
      ctx.fillText(k === 1 ? 'π' : k === -1 ? '-π' : k + 'π', x - 8, originY + 16);
    });

    function plot(fn, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      let started = false;
      let prevY = null;
      for (let px = 0; px <= w; px++) {
        const x = xMin + (px / w) * (xMax - xMin);
        let y = A * fn(B * x + C);
        const isTan = fn === Math.tan;
        if (isTan && (Math.abs(y) > yMax * 3)) {
          started = false;
          continue;
        }
        const py = originY - y * scaleY;
        if (isTan && prevY !== null && Math.abs(py - prevY) > h * 0.7) {
          started = false;
        }
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
        prevY = py;
      }
      ctx.stroke();
    }

    if (activeFns.sin) plot(Math.sin, fnColors.sin);
    if (activeFns.cos) plot(Math.cos, fnColors.cos);
    if (activeFns.tan) plot(Math.tan, fnColors.tan);

    // current angle marker on sin (if within range)
    if (currentRad !== undefined) {
      let markRad = currentRad;
      while (markRad > xMax) markRad -= 2 * Math.PI;
      while (markRad < xMin) markRad += 2 * Math.PI;
      const px = originX + markRad * scaleX;
      ctx.strokeStyle = 'rgba(243,239,226,0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  window.addEventListener('resize', () => { resizeCanvas(); update(); });
  resizeCanvas();
  update();

  // ---- Dreiecksrechner ----
  const triInputs = {
    a: document.getElementById('side_a'),
    b: document.getElementById('side_b'),
    c: document.getElementById('side_c'),
    A: document.getElementById('angle_A'),
    B: document.getElementById('angle_B'),
    C: document.getElementById('angle_C'),
  };
  const triSolveBtn = document.getElementById('triSolve');
  const triClearBtn = document.getElementById('triClear');
  const triError = document.getElementById('triError');
  const triOutput = document.getElementById('triOutput');
  const triTabs = document.getElementById('triTabs');
  const triValues = document.getElementById('triValues');
  const triCanvas = document.getElementById('triCanvas');
  const triCtx = triCanvas.getContext('2d');

  function rad(d) { return d * Math.PI / 180; }
  function deg(r) { return r * 180 / Math.PI; }

  function solveTriangle(vals) {
    const { a, b, c, A, B, C } = vals;
    const sideKnown = { a: a != null, b: b != null, c: c != null };
    const angleKnown = { A: A != null, B: B != null, C: C != null };
    const sidesCount = Object.values(sideKnown).filter(Boolean).length;
    const anglesCount = Object.values(angleKnown).filter(Boolean).length;

    if (sidesCount + anglesCount !== 3) return { error: 'Bitte genau drei Werte eingeben.' };
    if (sidesCount === 0) return { error: 'Mindestens eine Seite wird benötigt.' };

    let results = { a, b, c, A, B, C };

    if (sidesCount === 3) {
      const { a: aa, b: bb, c: cc } = results;
      if (aa + bb <= cc || aa + cc <= bb || bb + cc <= aa) return { error: 'Mit diesen Seitenlängen ist kein Dreieck möglich.' };
      results.A = deg(Math.acos((bb * bb + cc * cc - aa * aa) / (2 * bb * cc)));
      results.B = deg(Math.acos((aa * aa + cc * cc - bb * bb) / (2 * aa * cc)));
      results.C = 180 - results.A - results.B;
      return { solutions: [results] };
    }

    if (anglesCount === 2) {
      const angles = { A, B, C };
      const missingAngleKey = ['A', 'B', 'C'].find(k => angles[k] == null);
      const sum = ['A', 'B', 'C'].filter(k => k !== missingAngleKey).reduce((s, k) => s + angles[k], 0);
      if (sum >= 180) return { error: 'Winkelsumme muss unter 180° liegen.' };
      angles[missingAngleKey] = 180 - sum;

      const knownSideKey = ['a', 'b', 'c'].find(k => sideKnown[k]);
      const sideVal = results[knownSideKey];
      const oppAngleKey = knownSideKey.toUpperCase();
      const k = sideVal / Math.sin(rad(angles[oppAngleKey]));
      ['a', 'b', 'c'].forEach(sk => {
        if (results[sk] == null) results[sk] = k * Math.sin(rad(angles[sk.toUpperCase()]));
      });
      results.A = angles.A; results.B = angles.B; results.C = angles.C;
      return { solutions: [results] };
    }

    if (anglesCount === 1 && sidesCount === 2) {
      const knownAngleKey = ['A', 'B', 'C'].find(k => angleKnown[k]);
      const knownSides = ['a', 'b', 'c'].filter(k => sideKnown[k]);
      const knownSideOfAngle = knownAngleKey.toLowerCase();
      const isIncluded = !knownSides.includes(knownSideOfAngle);

      if (isIncluded) {
        const [p, q] = knownSides;
        const missingSide = ['a', 'b', 'c'].find(k => !knownSides.includes(k));
        const pVal = results[p], qVal = results[q];
        const angleRad = rad(results[knownAngleKey]);
        const missingVal = Math.sqrt(pVal * pVal + qVal * qVal - 2 * pVal * qVal * Math.cos(angleRad));
        results[missingSide] = missingVal;
        const { a: aa, b: bb, c: cc } = results;
        results.A = deg(Math.acos((bb * bb + cc * cc - aa * aa) / (2 * bb * cc)));
        results.B = deg(Math.acos((aa * aa + cc * cc - bb * bb) / (2 * aa * cc)));
        results.C = 180 - results.A - results.B;
        return { solutions: [results] };
      } else {
        const a_ = results[knownSideOfAngle];
        const A_ = results[knownAngleKey];
        const otherSideKey = knownSides.find(k => k !== knownSideOfAngle);
        const b_ = results[otherSideKey];
        const otherAngleKey = otherSideKey.toUpperCase();
        const missingSideKey = ['a', 'b', 'c'].find(k => k !== knownSideOfAngle && k !== otherSideKey);
        const missingAngleKey = missingSideKey.toUpperCase();

        const sinB = b_ * Math.sin(rad(A_)) / a_;
        if (sinB > 1.0001) return { error: 'Mit diesen Werten ist kein Dreieck möglich.' };
        const sinBClamped = Math.min(sinB, 1);
        const B1 = deg(Math.asin(sinBClamped));
        const k = a_ / Math.sin(rad(A_));
        const solutions = [];

        const C1 = 180 - A_ - B1;
        if (C1 > 0) {
          const c1 = k * Math.sin(rad(C1));
          let sol = { ...results };
          sol[otherAngleKey] = B1;
          sol[missingAngleKey] = C1;
          sol[missingSideKey] = c1;
          solutions.push(sol);
        }
        const B2 = 180 - B1;
        if (Math.abs(B2 - B1) > 0.01) {
          const C2 = 180 - A_ - B2;
          if (C2 > 0) {
            const c2 = k * Math.sin(rad(C2));
            let sol2 = { ...results };
            sol2[otherAngleKey] = B2;
            sol2[missingAngleKey] = C2;
            sol2[missingSideKey] = c2;
            solutions.push(sol2);
          }
        }
        if (solutions.length === 0) return { error: 'Mit diesen Werten ist kein Dreieck möglich.' };
        return { solutions, ambiguous: solutions.length > 1 };
      }
    }

    return { error: 'Diese Kombination von Werten wird nicht unterstützt.' };
  }

  let currentSolutions = [];
  let currentSolutionIndex = 0;

  triSolveBtn.addEventListener('click', () => {
    const vals = {};
    ['a', 'b', 'c', 'A', 'B', 'C'].forEach(k => {
      const raw = triInputs[k].value;
      vals[k] = raw === '' ? null : parseFloat(raw);
    });
    const result = solveTriangle(vals);
    triError.textContent = '';
    if (result.error) {
      triError.textContent = result.error;
      triOutput.style.display = 'none';
      return;
    }
    currentSolutions = result.solutions;
    currentSolutionIndex = 0;
    renderTriTabs();
    renderSolution();
    triOutput.style.display = 'grid';
  });

  triClearBtn.addEventListener('click', () => {
    Object.values(triInputs).forEach(inp => inp.value = '');
    triError.textContent = '';
    triOutput.style.display = 'none';
    currentSolutions = [];
  });

  function renderTriTabs() {
    triTabs.innerHTML = '';
    if (currentSolutions.length < 2) return;
    currentSolutions.forEach((_, i) => {
      const btn = document.createElement('button');
      btn.textContent = 'Lösung ' + (i + 1);
      btn.className = i === currentSolutionIndex ? 'active' : '';
      btn.addEventListener('click', () => {
        currentSolutionIndex = i;
        renderTriTabs();
        renderSolution();
      });
      triTabs.appendChild(btn);
    });
  }

  function renderSolution() {
    const sol = currentSolutions[currentSolutionIndex];
    triValues.innerHTML = '';
    const rows = [
      ['a', sol.a], ['b', sol.b], ['c', sol.c],
      ['A', sol.A], ['B', sol.B], ['C', sol.C],
    ];
    rows.forEach(([label, val]) => {
      const dt = document.createElement('dt');
      dt.textContent = label + (['A', 'B', 'C'].includes(label) ? ' (°)' : '');
      const dd = document.createElement('dd');
      dd.textContent = val.toFixed(3);
      triValues.appendChild(dt);
      triValues.appendChild(dd);
    });
    drawTriangle(sol);
  }

  function resizeTriCanvas() {
    const rect = triCanvas.getBoundingClientRect();
    triCanvas.width = rect.width * devicePixelRatio;
    triCanvas.height = rect.height * devicePixelRatio;
    triCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  function drawTriangle(sol) {
    resizeTriCanvas();
    const w = triCanvas.clientWidth;
    const h = triCanvas.clientHeight;
    triCtx.clearRect(0, 0, w, h);

    const Arad = rad(sol.A);
    const Ax = 0, Ay = 0;
    const Bx = sol.c, By = 0;
    const Cx = sol.b * Math.cos(Arad);
    const Cy = sol.b * Math.sin(Arad);

    const xs = [Ax, Bx, Cx], ys = [Ay, By, Cy];
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = 44;
    const spanX = (maxX - minX) || 1;
    const spanY = (maxY - minY) || 1;
    const scale = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);

    function tx(x) { return pad + (x - minX) * scale; }
    function ty(y) { return h - pad - (y - minY) * scale; }

    triCtx.strokeStyle = 'rgba(159,182,196,0.12)';
    triCtx.lineWidth = 1;
    for (let gx = 0; gx < w; gx += 24) { triCtx.beginPath(); triCtx.moveTo(gx, 0); triCtx.lineTo(gx, h); triCtx.stroke(); }
    for (let gy = 0; gy < h; gy += 24) { triCtx.beginPath(); triCtx.moveTo(0, gy); triCtx.lineTo(w, gy); triCtx.stroke(); }

    triCtx.strokeStyle = '#E3A23B';
    triCtx.lineWidth = 2.2;
    triCtx.beginPath();
    triCtx.moveTo(tx(Ax), ty(Ay));
    triCtx.lineTo(tx(Bx), ty(By));
    triCtx.lineTo(tx(Cx), ty(Cy));
    triCtx.closePath();
    triCtx.stroke();
    triCtx.fillStyle = 'rgba(227,162,59,0.12)';
    triCtx.fill();

    triCtx.fillStyle = '#F3EFE2';
    triCtx.font = '13px "IBM Plex Mono", monospace';
    triCtx.fillText('A', tx(Ax) - 6, ty(Ay) + 16);
    triCtx.fillText('B', tx(Bx) - 6, ty(By) + 16);
    triCtx.fillText('C', tx(Cx) - 6, ty(Cy) - 8);

    triCtx.fillStyle = 'rgba(243,239,226,0.6)';
    triCtx.font = '11px "IBM Plex Mono", monospace';
    triCtx.fillText('c', (tx(Ax) + tx(Bx)) / 2, (ty(Ay) + ty(By)) / 2 + 14);
    triCtx.fillText('a', (tx(Bx) + tx(Cx)) / 2 + 8, (ty(By) + ty(Cy)) / 2);
    triCtx.fillText('b', (tx(Ax) + tx(Cx)) / 2 - 18, (ty(Ay) + ty(Cy)) / 2);
  }

  window.addEventListener('resize', () => {
    if (currentSolutions.length) drawTriangle(currentSolutions[currentSolutionIndex]);
  });
</script>

</body>
</html>
